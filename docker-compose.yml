services:
  db:
    image: postgres:16-alpine
    container_name: coffee-shop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: coffeeshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - coffee-shop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coffeeshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coffee-shop-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/coffeeshop
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: local-dev-secret-change-me-please-0123456789
      JWT_EXPIRATION_MS: 86400000
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  coffee-shop-db-data:
