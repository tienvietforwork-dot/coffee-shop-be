spring:
  # Local runs read the shared coffee-shop-be/.env, then app-core/.env (optional, overrides it).
  # Works from the app folder (mvnw, run-all) or the repo root (IDE). Real env vars (Render) still win.
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties],optional:file:app-core/.env[.properties]
  application:
    name: coffee-shop-be

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coffeeshop}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema is managed by hand directly on the shared Neon database via
      # DBeaver (no Flyway/migration files) — Hibernate must never try to
      # create/alter/validate tables here.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-production-please-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  shipping:
    fee: ${SHIPPING_FEE:15000}
  loyalty:
    vnd-per-point: 10000
  inventory:
    expiry-warning-days: 7
    # CoffeeStatusBackgroundService cycle: sets coffees SOLD_OUT / AVAILABLE from stock (5 minutes)
    status-scan-ms: ${STATUS_SCAN_MS:300000}
    # chốt tồn cuối ngày (inventory_snapshots)
    snapshot-cron: "0 55 23 * * *"
  # FE address used in links sent to customers (ZNS / SMS)
  public-site-url: ${PUBLIC_SITE_URL:http://localhost:5173}
  audit:
    retention-days: ${AUDIT_RETENTION_DAYS:180}
  # Integrations: each runs simulated until its keys are set (mode=sandbox / staging / production / misa)
  payment:
    vnpay:
      mode: ${VNPAY_MODE:simulated}
      tmn-code: ${VNPAY_TMN_CODE:COFFEEHL}
      hash-secret: ${VNPAY_HASH_SECRET:SIMULATED-HASH-SECRET-0123456789}
      return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/result}
      public-api-base: ${PUBLIC_API_BASE:http://localhost:8080}
      expire-minutes: 15
  delivery:
    ahamove:
      mode: ${AHAMOVE_MODE:simulated}
      base-url: ${AHAMOVE_BASE_URL:https://partner-apistg.ahamove.com/v3}
      token: ${AHAMOVE_TOKEN:}
      service-id: ${AHAMOVE_SERVICE:SGN-BIKE}
      webhook-token: ${AHAMOVE_WEBHOOK_TOKEN:coffeeholic-webhook}
      shop-address: ${SHOP_ADDRESS:Coffeeholic, Quận 1, TP. Hồ Chí Minh}
      shop-phone: ${SHOP_PHONE:0900000000}
  einvoice:
    mode: ${EINVOICE_MODE:simulated}
    seller-name: ${SELLER_NAME:HỘ KINH DOANH COFFEEHOLIC}
    seller-tax-code: ${SELLER_TAX_CODE:0312345678}
    seller-address: ${SELLER_ADDRESS:Quận 1, TP. Hồ Chí Minh}
    series: ${EINVOICE_SERIES:2C26MCH}
  notify:
    esms:
      mode: ${ESMS_MODE:simulated}
      api-key: ${ESMS_API_KEY:}
      secret-key: ${ESMS_SECRET_KEY:}
      brandname: ${ESMS_BRANDNAME:COFFEEHOLIC}
      oa-id: ${ZALO_OA_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  default-produces-media-type: application/json   # application/json instead of */*
  default-consumes-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none                # controllers start collapsed
    default-models-expand-depth: -1    # hide the Schemas section at the bottom
    try-it-out-enabled: true           # no extra "Try it out" click
    persist-authorization: true        # keep the Bearer token across reloads
    tags-sorter: alpha
    operations-sorter: method
    filter: true                       # search box to filter by tag
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.coffeeshop: INFO
