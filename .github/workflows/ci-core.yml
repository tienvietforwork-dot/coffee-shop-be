name: CI - app-core

on:
  push:
    branches: [main]
    paths:
      - 'app-core/**'
      - '.github/workflows/ci-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app-core/**'
      - '.github/workflows/ci-core.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: app-core/pom.xml

      - name: Run tests
        run: mvn -B test

      - name: Build jar (skip tests, already ran above)
        run: mvn -B -DskipTests package
