name: Backup Neon database

on:
  schedule:
    # Every Sunday at 00:00 UTC (~07:00 Vietnam time)
    - cron: '0 0 * * 0'
  workflow_dispatch: {} # allows manually clicking "Run workflow" any time

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout db-backups branch
        uses: actions/checkout@v4
        with:
          ref: db-backups
          fetch-depth: 0

      - name: Dump the Neon database
        # Neon runs a newer Postgres server version than the apt-get
        # postgresql-client package on ubuntu-latest, and pg_dump refuses to
        # talk to a server newer than itself. Run pg_dump from the official
        # postgres:18 image instead so the client version always matches.
        run: |
          mkdir -p backups
          STAMP=$(date -u +'%Y%m%d-%H%M%S')
          docker run --rm postgres:18-alpine \
            pg_dump "${NEON_DATABASE_URL}" --no-owner --no-privileges \
            > "backups/backup-${STAMP}.sql"
          echo "BACKUP_FILE=backups/backup-${STAMP}.sql" >> "$GITHUB_ENV"
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

      - name: Commit and push the backup
        run: |
          git config user.name "coffee-shop-backup-bot"
          git config user.email "actions@github.com"
          git add "${BACKUP_FILE}"
          git commit -m "Backup: ${BACKUP_FILE}"
          git push origin db-backups
