spring:
  datasource:
    url: jdbc:h2:mem:coffeeshop;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-secret-key-for-junit-tests-only-0123456789
    expiration-ms: 3600000
  cors:
    allowed-origin: http://localhost:5173
