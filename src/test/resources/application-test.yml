spring:
  datasource:
    url: jdbc:h2:mem:coffeeshop;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # Tests run against a throwaway in-memory H2 instance, so it's fine
      # (and simplest) to let Hibernate generate the schema from the
      # entities directly — production schema is managed by hand on Neon.
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-secret-key-for-junit-tests-only-0123456789
    expiration-ms: 3600000
  cors:
    allowed-origin: http://localhost:5173
