spring:
  # Local runs read the shared coffee-shop-be/.env, then app-stats/.env (optional, overrides it).
  # Works from the app folder (mvnw, run-all) or the repo root (IDE). Real env vars (Render) still win.
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties],optional:file:app-stats/.env[.properties]
  application:
    name: coffee-shop-be

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema is managed by hand directly on the shared Neon database via
      # DBeaver (no Flyway/migration files) — Hibernate must never try to
      # create/alter/validate tables here.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8082}}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-production-please-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  shipping:
    fee: ${SHIPPING_FEE:15000}
  loyalty:
    vnd-per-point: 10000
  inventory:
    expiry-warning-days: 7
    # CoffeeStatusBackgroundService cycle: sets coffees SOLD_OUT / AVAILABLE from stock (5 minutes)
    status-scan-ms: ${STATUS_SCAN_MS:300000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  default-produces-media-type: application/json   # application/json instead of */*
  default-consumes-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none                # controllers start collapsed
    default-models-expand-depth: -1    # hide the Schemas section at the bottom
    try-it-out-enabled: true           # no extra "Try it out" click
    persist-authorization: true        # keep the Bearer token across reloads
    tags-sorter: alpha
    operations-sorter: method
    filter: true                       # search box to filter by tag
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.coffeeshop: INFO
